<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Audience display — Simple Worship Presenter</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&family=Playfair+Display:wght@400;600;700&family=Lora:wght@400;500;600;700&family=Merriweather:wght@300;400;700&family=Libre+Baskerville:wght@400;700&family=Roboto+Slab:wght@300;400;700&family=Oswald:wght@300;400;600&family=Bebas+Neue&family=Montserrat:wght@300;400;600;800&family=Poppins:wght@300;400;600;800&family=Inter:wght@300;400;600;800&family=Source+Sans+3:wght@300;400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=53">
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#111}
  .stage{height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;background:linear-gradient(135deg,#b96b4d,#d59063);color:#fff;transition:background .25s;padding:6vh 0}
  .stage.blank{background:#000!important}
  .stage.blank>*{visibility:hidden}
  .stage-inner{width:74%;max-width:1400px;position:relative;z-index:2}
  .stage img.slide-image{display:block;max-width:70vw;max-height:52vh;object-fit:contain;margin:0 0 26px;border-radius:6px;box-shadow:0 18px 50px #0006}
  .stage-kicker{font:500 12px 'DM Mono',monospace;letter-spacing:1.6px;color:#ffe6b4;margin:0 0 8%}
  .stage-text{font:600 clamp(34px,6vw,104px)/1.12 Manrope,sans-serif;letter-spacing:-.025em;margin:0;white-space:normal}
  .stage-text.song{font-family:Georgia,serif;font-weight:400}
  .stage-foot{position:absolute;left:0;right:0;bottom:22px;display:flex;justify-content:space-between;padding:0 26px;font:11px 'DM Mono',monospace;color:#fff9;letter-spacing:.8px}
  .stage-hint{position:absolute;bottom:22px;left:0;right:0;text-align:center;color:#fff8;font:10px 'DM Mono',monospace;letter-spacing:1px;z-index:3}
  .stage.blank .stage-hint{visibility:hidden}
  .status-dot{position:absolute;top:22px;right:26px;z-index:3;display:flex;align-items:center;gap:8px;font:10px 'DM Mono';color:#fff9}
  .status-dot i{width:8px;height:8px;border-radius:50%;background:#7fe08a;box-shadow:0 0 0 4px #7fe08a33}
  .status-dot.stale i{background:#f0b45c;box-shadow:0 0 0 4px #f0b45c33}
  .stage.left .stage-inner{text-align:left}
</style>
</head>
<body>
  <main class="stage" id="stage">
    <div class="stage-inner">
      <video class="stage-video" id="stageVideo" muted loop playsinline preload="auto" hidden></video>
      <div class="stage-overlay" id="stageOverlay" hidden></div>
      <img class="slide-image" id="slideImage" alt="" hidden>
      <p class="stage-kicker" id="kicker">SIMPLE WORSHIP PRESENTER</p>
      <h1 class="stage-text" id="title">Waiting for the operator…</h1>
    </div>
    <div class="stage-foot"><span id="footer">Simple Worship Presenter</span><span id="count">—</span></div>
    <div class="status-dot" id="status"><i></i><span id="statusText">Connected</span></div>
    <div class="stage-hint">SPACE / → next · ← previous · F fullscreen</div>
  </main>
  <script src="presenter.js?v=53"></script>
</body>
</html>
